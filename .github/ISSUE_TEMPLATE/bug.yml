name: Report a bug
description: Something in BikeStudio doesn't work as expected.
labels: [bug]
body:
  - type: textarea
    attributes: {label: What happened, and what did you expect?}
    validations: {required: true}
  - type: textarea
    attributes: {label: Steps to reproduce}
  - type: input
    attributes: {label: BikeStudio version and operating system}
