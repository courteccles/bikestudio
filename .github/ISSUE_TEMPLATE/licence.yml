name: Ask about a commercial licence
description: For businesses with more than 4 people, or US$25K or more in annual revenue or funding raised.
labels: [licensing]
body:
  - type: markdown
    attributes: {value: "Issues are public. Don't post anything confidential here. We'll arrange a private channel."}
  - type: input
    attributes: {label: Business name}
  - type: textarea
    attributes: {label: How do you plan to use BikeStudio?}
    validations: {required: true}
