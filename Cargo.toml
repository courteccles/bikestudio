[workspace]
resolver = "3"
members = [
    "crates/bike-model",
    "crates/bike-defaults",
    "crates/bike-components",
    "crates/bike-geometry",
    "crates/bike-application",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/courteccles/bikestudio"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
proptest = "1"
toml = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"
