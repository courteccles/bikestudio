# Starting geometry for the default solve (S-GEOM G11, G12).
# A bike row applies to the listed wheel sizes and front travel up to max_front_travel.
# Wheelbase, BB height and head tube length are usually solved; their values here are
# only starting guesses for the solver.

default_wheel = "29"

[pedal]
length = 100.0
thickness = 20.0
source = "Owner's choice, S-GEOM G13."

[cranks]
small = 165.0
medium = 170.0
large = 175.0
source = "Owner's choice, S-GEOM G13: crank length follows rider size."

[[bikes]]
