# Naive tubes (S-TUBES T3, T4, T5): round sections, densities and fittings allowances.
# These are generic starting values for mass and the side view, not fabrication data (D6).
# Sections are [outside diameter, wall] in mm. Fitting masses are grams.

default_material = "steel"
bottom_bracket_shell_width = 73.0
bottom_bracket_shell_source = "73 mm is the common BSA threaded mountain bike shell width."

[junctions]
top_tube_below_head_tube_top = 25.0
down_tube_above_head_tube_bottom = 35.0
seat_tube_overhang = 60.0
min_seat_tube_below_junction = 50.0
source = "S-TUBES T3. Seat tube overhang from the Nicolai Argon GTB GPI 2025 sizes M to XXL (60 mm)."
seat_tube_bend_radius = 76.2
seat_tube_bend_radius_source = "3 inch centreline radius, the tight bent seat tube Peter Verdone (frame builder) makes: https://www.peterverdone.com/?p=14176. One builder's figure, used for every material until per-material figures are found."

[materials.steel]
density = 7.85
density_source = "Chromoly 4130, 7.85 g/cm3 (ASM handbook value)."
sections_source = "Generic round chromoly sizes common in frame building; starting values, not from one catalogue."
head_tube = [44.5, 1.1]
top_tube = [31.8, 0.8]
down_tube = [38.1, 0.9]
seat_tube = [31.8, 0.9]
chainstay = [22.2, 0.8]
seatstay = [16.0, 0.8]
bottom_bracket_shell = [40.0, 2.5]
fittings = [
  { name = "Dropouts", mass = 220.0, at = "rear_axle" },
  { name = "Bosses, guides and brake mount", mass = 60.0, at = "tubes" },
  { name = "Braze and weld filler", mass = 60.0, at = "tubes" },
]
fittings_source = "Estimate for a steel hardtail; to be checked against weighed frames."

